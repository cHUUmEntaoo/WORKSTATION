; WORKSTATION NOCTURNE - INTERACTIVE DOCK / V1.4
; ASCII-only INI: use escaped Segoe MDL2 Assets icons.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
DefaultWindowX=0
DefaultWindowY=38
DefaultAlwaysOnTop=1
DefaultDraggable=1
DefaultClickThrough=0
DefaultSnapEdges=1

[Metadata]
Name=WORKSTATION Interactive Dock
Author=WORKSTATION
Version=1.4
Information=Seven-button dark Red Team dock, interactive panels.

[Variables]
Base=13,15,24,248
Card=29,32,45,245
Active=73,24,39,245
Border=78,84,105,170
Text=211,220,239,255
Red=255,53,83,255
Cyan=105,218,237,255

[DockFrame]
Meter=Shape
Shape=Rectangle 0,0,56,405,15 | Fill Color #Base# | StrokeWidth 1 | Stroke Color #Border#
Shape2=Rectangle 23,8,10,3,1 | Fill Color #Red# | StrokeWidth 0
Shape3=Rectangle 6,35,44,44,10 | Fill Color #Card# | StrokeWidth 0
Shape4=Rectangle 6,87,44,44,10 | Fill Color #Card# | StrokeWidth 0
Shape5=Rectangle 6,139,44,44,10 | Fill Color #Card# | StrokeWidth 0
Shape6=Rectangle 6,191,44,44,10 | Fill Color #Card# | StrokeWidth 0
Shape7=Rectangle 6,243,44,44,10 | Fill Color #Card# | StrokeWidth 0
Shape8=Rectangle 6,295,44,44,10 | Fill Color #Card# | StrokeWidth 0
Shape9=Rectangle 6,347,44,44,10 | Fill Color #Card# | StrokeWidth 0
AntiAlias=1

[OperationsIndicator]
Meter=Shape
X=6
Y=35
Shape=Rectangle 0,0,44,44,10 | Fill Color #Active# | StrokeWidth 1 | Stroke Color #Red#
Hidden=1
AntiAlias=1

[LauncherIndicator]
Meter=Shape
X=6
Y=87
Shape=Rectangle 0,0,44,44,10 | Fill Color #Active# | StrokeWidth 1 | Stroke Color #Red#
Hidden=1
AntiAlias=1

[ControlIndicator]
Meter=Shape
X=6
Y=347
Shape=Rectangle 0,0,44,44,10 | Fill Color #Active# | StrokeWidth 1 | Stroke Color #Red#
Hidden=1
AntiAlias=1

[IconStyle]
X=28
W=44
H=44
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=19
FontColor=#Text#
FontWeight=400
SolidColor=0,0,0,1
AntiAlias=1

[MeterSystem]
Meter=String
MeterStyle=IconStyle
Y=57
Text=[\xE770]
FontColor=#Red#
ToolTipText=Mostrar / ocultar Operations
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Launcher"][!DeactivateConfig "WORKSTATION\ControlCenter"][!ToggleConfig "WORKSTATION\Operations" "Operations.ini"]

[MeterApps]
Meter=String
MeterStyle=IconStyle
Y=109
Text=[\xE8A9]
ToolTipText=Mostrar / ocultar Launcher
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Operations"][!DeactivateConfig "WORKSTATION\ControlCenter"][!ToggleConfig "WORKSTATION\Launcher" "Launcher.ini"]

[MeterTerminal]
Meter=String
MeterStyle=IconStyle
Y=161
Text=[\xE756]
ToolTipText=Abrir Windows Terminal
LeftMouseUpAction=["wt.exe"]

[MeterFiles]
Meter=String
MeterStyle=IconStyle
Y=213
Text=[\xE8B7]
ToolTipText=Abrir Explorador
LeftMouseUpAction=["explorer.exe"]

[MeterSettings]
Meter=String
MeterStyle=IconStyle
Y=265
Text=[\xE713]
ToolTipText=Abrir Configuracion
LeftMouseUpAction=["explorer.exe" "ms-settings:"]

[MeterMonitor]
Meter=String
MeterStyle=IconStyle
Y=317
Text=[\xE9D9]
ToolTipText=Administrador de tareas
LeftMouseUpAction=["taskmgr.exe"]

[MeterControlCenter]
Meter=String
MeterStyle=IconStyle
Y=369
Text=CC
FontFace=Consolas
FontSize=13
FontWeight=700
FontColor=#Red#
ToolTipText=Mostrar / ocultar Control Center
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Launcher"][!DeactivateConfig "WORKSTATION\Operations"][!ToggleConfig "WORKSTATION\ControlCenter" "ControlCenter.ini"]
