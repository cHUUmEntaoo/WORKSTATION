; WORKSTATION NOCTURNE V2 - DOCK / desktop layer
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
DefaultWindowX=0
DefaultWindowY=38
DefaultAlwaysOnTop=-2
DefaultDraggable=0
DefaultClickThrough=0
DefaultSnapEdges=1

[Metadata]
Name=WORKSTATION NOCTURNE Dock
Author=WORKSTATION ULTIMATE
Version=2.0
Information=Interactive dock; 60px GlazeWM left rail required

[Variables]
Base=10,12,19,251
Card=26,30,42,255
Active=74,22,35,250
Border=64,69,85,180
Text=203,213,231,255
Muted=138,147,167,255
Red=244,51,83,255
Cyan=105,211,227,255

[DockFrame]
Meter=Shape
Shape=Rectangle 1,0,55,537,14 | Fill Color #Base# | StrokeWidth 1 | Stroke Color #Border#
Shape2=Rectangle 23,8,10,3,1 | Fill Color #Red# | StrokeWidth 0
Shape3=Rectangle 6,36,44,43,10 | Fill Color #Card# | StrokeWidth 0
Shape4=Rectangle 6,86,44,43,10 | Fill Color #Card# | StrokeWidth 0
Shape5=Rectangle 6,136,44,43,10 | Fill Color #Card# | StrokeWidth 0
Shape6=Rectangle 6,186,44,43,10 | Fill Color #Card# | StrokeWidth 0
Shape7=Rectangle 6,236,44,43,10 | Fill Color #Card# | StrokeWidth 0
Shape8=Rectangle 6,286,44,43,10 | Fill Color #Card# | StrokeWidth 0
Shape9=Rectangle 6,336,44,43,10 | Fill Color #Card# | StrokeWidth 0
Shape10=Rectangle 6,386,44,43,10 | Fill Color #Card# | StrokeWidth 0
Shape11=Rectangle 6,436,44,43,10 | Fill Color #Card# | StrokeWidth 0
AntiAlias=1

[HomeIndicator]
Meter=Shape
Shape=Rectangle 6,36,44,43,10 | Fill Color #Active# | StrokeWidth 1 | Stroke Color #Red#
Hidden=1
AntiAlias=1

[LauncherIndicator]
Meter=Shape
Shape=Rectangle 6,86,44,43,10 | Fill Color #Active# | StrokeWidth 1 | Stroke Color #Red#
Hidden=1
AntiAlias=1

[ActivityIndicator]
Meter=Shape
Shape=Rectangle 6,136,44,43,10 | Fill Color #Active# | StrokeWidth 1 | Stroke Color #Red#
Hidden=1
AntiAlias=1

[OperationsIndicator]
Meter=Shape
Shape=Rectangle 6,186,44,43,10 | Fill Color #Active# | StrokeWidth 1 | Stroke Color #Red#
Hidden=1
AntiAlias=1

[ControlIndicator]
Meter=Shape
Shape=Rectangle 6,236,44,43,10 | Fill Color #Active# | StrokeWidth 1 | Stroke Color #Red#
Hidden=1
AntiAlias=1

[IconStyle]
X=28
W=44
H=43
StringAlign=CenterCenter
FontFace=Segoe MDL2 Assets
FontSize=18
FontColor=#Text#
FontWeight=400
SolidColor=0,0,0,1
AntiAlias=1

[MeterHome]
Meter=String
MeterStyle=IconStyle
Y=57
Text=[\xE80F]
ToolTipText=HOME
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Launcher"][!DeactivateConfig "WORKSTATION\Activity"][!DeactivateConfig "WORKSTATION\Operations"][!DeactivateConfig "WORKSTATION\ControlCenter"][!ToggleConfig "WORKSTATION\Home" "Home.ini"][!ZPos "1" "WORKSTATION\Home"][!Move "64" "40" "WORKSTATION\Home"]

[MeterApps]
Meter=String
MeterStyle=IconStyle
Y=107
Text=[\xE8A9]
ToolTipText=APLICACIONES
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Home"][!DeactivateConfig "WORKSTATION\Activity"][!DeactivateConfig "WORKSTATION\Operations"][!DeactivateConfig "WORKSTATION\ControlCenter"][!ToggleConfig "WORKSTATION\Launcher" "Launcher.ini"][!ZPos "1" "WORKSTATION\Launcher"][!Move "64" "40" "WORKSTATION\Launcher"]

[MeterActivity]
Meter=String
MeterStyle=IconStyle
Y=157
Text=[\xE7F4]
ToolTipText=ACTIVIDAD
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Home"][!DeactivateConfig "WORKSTATION\Launcher"][!DeactivateConfig "WORKSTATION\Operations"][!DeactivateConfig "WORKSTATION\ControlCenter"][!ToggleConfig "WORKSTATION\Activity" "Activity.ini"][!ZPos "1" "WORKSTATION\Activity"][!Move "64" "40" "WORKSTATION\Activity"]

[MeterOps]
Meter=String
MeterStyle=IconStyle
Y=207
Text=[\xE9D9]
ToolTipText=OPERATIONS
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Home"][!DeactivateConfig "WORKSTATION\Launcher"][!DeactivateConfig "WORKSTATION\Activity"][!DeactivateConfig "WORKSTATION\ControlCenter"][!ToggleConfig "WORKSTATION\Operations" "Operations.ini"][!ZPos "1" "WORKSTATION\Operations"][!Move "64" "40" "WORKSTATION\Operations"]

[MeterControlCenter]
Meter=String
MeterStyle=IconStyle
Y=257
Text=CC
ToolTipText=CONTROL CENTER
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Home"][!DeactivateConfig "WORKSTATION\Launcher"][!DeactivateConfig "WORKSTATION\Activity"][!DeactivateConfig "WORKSTATION\Operations"][!ToggleConfig "WORKSTATION\ControlCenter" "ControlCenter.ini"][!ZPos "1" "WORKSTATION\ControlCenter"][!Move "64" "40" "WORKSTATION\ControlCenter"]
FontFace=Consolas
FontSize=12
FontWeight=700

[MeterTerminal]
Meter=String
MeterStyle=IconStyle
Y=307
Text=[\xE756]
ToolTipText=TERMINAL
LeftMouseUpAction=["wt.exe"]

[MeterFiles]
Meter=String
MeterStyle=IconStyle
Y=357
Text=[\xE8B7]
ToolTipText=ARCHIVOS
LeftMouseUpAction=["explorer.exe"]

[MeterSettings]
Meter=String
MeterStyle=IconStyle
Y=407
Text=[\xE713]
ToolTipText=CONFIGURACION
LeftMouseUpAction=["explorer.exe" "ms-settings:"]

[MeterMonitor]
Meter=String
MeterStyle=IconStyle
Y=457
Text=TM
ToolTipText=ADMINISTRADOR DE TAREAS
LeftMouseUpAction=["taskmgr.exe"]
FontFace=Consolas
FontSize=12
FontWeight=700

[MeasureDockClock]
Measure=Time
Format=%H:%M

[MeterDockClock]
Meter=String
MeasureName=MeasureDockClock
X=28
Y=494
W=52
H=30
Text=%1
StringAlign=Center
FontFace=Consolas
FontSize=10
FontColor=#Muted#
AntiAlias=1
ToolTipText=Hora local de Windows
