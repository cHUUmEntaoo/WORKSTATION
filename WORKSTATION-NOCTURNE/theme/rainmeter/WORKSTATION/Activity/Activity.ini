[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=386
SkinHeight=770
DefaultWindowX=64
DefaultWindowY=53
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultClickThrough=0
DefaultSnapEdges=1
OnRefreshAction=[!ShowMeter "ActivityIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]
OnCloseAction=[!HideMeter "ActivityIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]

[Metadata]
Name=WORKSTATION Activity
Author=WORKSTATION ULTIMATE
Version=3.0
Information=NOCTURNE COMMAND DECK - real desktop metrics and native interactions

[Variables]
Base=9,12,20,251
Card=22,26,39,251
Card2=29,34,50,249
Card3=15,21,31,251
Edge=54,65,87,212
Text=235,241,251,255
Muted=154,168,194,255
Red=255,49,88,255
RedMuted=115,24,46,255
Cyan=78,223,245,255
Blue=104,182,255,255
Green=80,234,171,255
Gold=253,187,96,255
Violet=194,135,250,255
Line=51,62,81,255
CalendarTitleText=CALENDARIO

[Background]
Meter=Shape
Shape=Rectangle 1,1,384,768,18 | Fill Color #Base# | StrokeWidth 1 | Stroke Color #Edge#
Shape2=Rectangle 1,1,5,34,2 | Fill Color #Red# | StrokeWidth 0
Shape3=Line 20,766,366,766 | StrokeWidth 2 | Stroke Color #RedMuted#
AntiAlias=1

[Header]
Meter=String
X=22
Y=18
Text=ACTIVITY  /  NOCTURNE
FontFace=Segoe UI Semibold
FontSize=13
FontColor=#Text#
AntiAlias=1

[HeaderMini]
Meter=String
X=22
Y=43
Text=NOTIFICACIONES  /  CONTROL DE SISTEMA
FontFace=Consolas
FontSize=8
FontColor=#Muted#
AntiAlias=1

[Close]
Meter=String
X=362
Y=28
W=27
H=30
Text=X
StringAlign=CenterCenter
FontFace=Consolas
FontSize=12
FontColor=#Red#
SolidColor=0,0,0,1
AntiAlias=1
ToolTipText=Cerrar panel
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Activity"]
[MeasureClock]
Measure=Time
Format=%H:%M:%S
[MeasureDate]
Measure=Time
Format=%a, %#d %B %Y
FormatLocale=es-ES
[MeasureCPU]
Measure=CPU
Processor=0
[MeasureRAM]
Measure=PhysicalMemory
[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=60
[MeasureDown]
Measure=NetIn
Interface=Best
[MeasureUp]
Measure=NetOut
Interface=Best
[MeasureVolume]
Measure=Plugin
Plugin=Win7AudioPlugin
MaxValue=100
[ActivityHead]
Meter=Shape
Shape=Rectangle 12,75,362,91,11 | Fill Color #Card3# | StrokeWidth 1 | Stroke Color #Edge#
AntiAlias=1
