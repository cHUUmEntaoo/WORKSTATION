MouseOverAction=[!SetOption "CalendarNext" "FontColor" "#Red#"][!UpdateMeter "CalendarNext"][!Redraw]
MouseLeaveAction=[!SetOption "CalendarNext" "FontColor" "#Red#"][!UpdateMeter "CalendarNext"][!Redraw]
[CalendarGrid]
