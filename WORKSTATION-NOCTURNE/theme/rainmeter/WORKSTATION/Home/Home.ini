; WORKSTATION NOCTURNE v2 - Home interactive module
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=308
SkinHeight=650
DefaultWindowX=64
DefaultWindowY=40
DefaultAlwaysOnTop=1
DefaultDraggable=1
DefaultClickThrough=0
DefaultSnapEdges=1
OnRefreshAction=[!HideMeter "LauncherIndicator" "WORKSTATION\Dock"][!HideMeter "ActivityIndicator" "WORKSTATION\Dock"][!HideMeter "OperationsIndicator" "WORKSTATION\Dock"][!HideMeter "ControlIndicator" "WORKSTATION\Dock"][!ShowMeter "HomeIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]
OnCloseAction=[!HideMeter "HomeIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]

[Metadata]
Name=WORKSTATION Home
Author=WORKSTATION ULTIMATE
Version=2.0
Information=Minimal functional dashboard with real Windows interactions

[Variables]
Base=11,13,20,250
Card=26,29,40,249
Card2=34,37,50,255
Border=66,72,91,175
Text=222,227,241,255
Muted=145,154,178,255
Red=244,51,83,255
Cyan=103,195,217,255
Green=151,216,172,255
Line=55,62,81,220
CalendarTitleText=CALENDARIO

[Background]
Meter=Shape
Shape=Rectangle 1,1,306,648,16 | Fill Color #Base# | StrokeWidth 1 | Stroke Color #Border#
Shape2=Rectangle 15,15,3,26,2 | Fill Color #Red# | StrokeWidth 0
AntiAlias=1

[Title]
Meter=String
X=30
Y=18
Text=NOCTURNE / HOME
FontFace=Segoe UI Semibold
FontSize=11
FontColor=#Text#
AntiAlias=1

[Subtitle]
Meter=String
X=30
Y=40
Text=WORKSTATION ULTIMATE  /  RED TEAM
FontFace=Consolas
FontSize=8
FontColor=#Muted#
AntiAlias=1

[Close]
Meter=String
X=282
Y=29
W=24
H=28
StringAlign=CenterCenter
FontFace=Consolas
FontSize=13
FontColor=#Red#
SolidColor=0,0,0,1
Text=X
AntiAlias=1
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Home"]
ToolTipText=Cerrar panel

[MeasureClock]
Measure=Time
Format=%H:%M
[MeasureDate]
Measure=Time
Format=%A, %#d %B %Y
FormatLocale=es-ES
[MeasureCPU]
Measure=CPU
Processor=0
[MeasureRAM]
Measure=PhysicalMemory
[MeasureNet]
Measure=NetIn
Interface=Best
DynamicVariables=1
[MeasureVolume]
Measure=Plugin
Plugin=Win7AudioPlugin
MaxValue=100
[MeasureCalendar]
Measure=Script
ScriptFile=#CURRENTPATH#Calendar.lua
UpdateDivider=30

[Clock]
Meter=String
X=21
Y=64
W=270
H=62
StringAlign=Left
Text=%1
FontFace=Segoe UI Light
FontSize=38
FontColor=#Text#
AntiAlias=1
MeasureName=MeasureClock
[FullDate]
Meter=String
X=24
Y=118
W=278
H=22
StringAlign=Left
Text=%1
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1
MeasureName=MeasureDate
[CalendarCard]
Meter=Shape
Shape=Rectangle 10,154,288,211,12 | Fill Color #Card# | StrokeWidth 1 | Stroke Color #Border#
AntiAlias=1
[CalendarTitle]
Meter=String
X=24
Y=169
W=200
H=22
StringAlign=Left
Text=#CalendarTitleText#
FontFace=Segoe UI
FontSize=11
FontColor=#Cyan#
AntiAlias=1
FontWeight=600
DynamicVariables=1
[CalendarPrevious]
Meter=String
X=249
Y=169
W=22
H=24
StringAlign=Center
Text=<
FontFace=Consolas
FontSize=14
FontColor=#Red#
AntiAlias=1
SolidColor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure "MeasureCalendar" "ChangeMonth(-1)"]
ToolTipText=Mes anterior
MouseOverAction=[!SetOption "CalendarPrevious" "FontColor" "#Red#"][!UpdateMeter "CalendarPrevious"][!Redraw]
MouseLeaveAction=[!SetOption "CalendarPrevious" "FontColor" "#Red#"][!UpdateMeter "CalendarPrevious"][!Redraw]
[CalendarNext]
