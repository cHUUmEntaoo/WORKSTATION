[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=386
SkinHeight=610
DefaultWindowX=64
DefaultWindowY=53
DefaultAlwaysOnTop=-2
DefaultDraggable=1
