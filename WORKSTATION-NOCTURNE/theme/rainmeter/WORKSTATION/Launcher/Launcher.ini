; WORKSTATION NOCTURNE - LAUNCHER V1.1
[Rainmeter]
Update=1000
AccurateText=1
SkinWidth=284
SkinHeight=440
DefaultWindowX=58
DefaultWindowY=40
DefaultAlwaysOnTop=1
DefaultDraggable=1
DefaultClickThrough=0
OnRefreshAction=[!HideMeter "OperationsIndicator" "WORKSTATION\Dock"][!HideMeter "ControlIndicator" "WORKSTATION\Dock"][!ShowMeter "LauncherIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]
OnCloseAction=[!HideMeter "LauncherIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]
[Metadata]
Name=WORKSTATION Launcher
Author=WORKSTATION
Version=1.1
Information=App shortcuts and Windows native panels
[Variables]
Base=13,15,24,248
Card=34,37,53,245
Border=70,75,95,180
Text=220,225,240,255
Muted=155,163,185,255
Red=255,53,83,255
Cyan=105,218,237,255
[Background]
Meter=Shape
Shape=Rectangle 1,1,282,438,16 | Fill Color #Base# | StrokeWidth 1 | Stroke Color #Border#
Shape2=Rectangle 16,16,4,26,2 | Fill Color #Red# | StrokeWidth 0
AntiAlias=1
[Title]
Meter=String
X=31
Y=18
Text=WORKSTATION LAUNCHER
FontFace=Segoe UI Semibold
FontSize=11
FontColor=#Text#
AntiAlias=1
[Subtitle]
Meter=String
X=31
Y=39
Text=APPLICATIONS / SYSTEM
FontFace=Consolas
FontSize=8
FontColor=#Muted#
AntiAlias=1
[Close]
Meter=String
X=254
Y=30
W=24
H=28
StringAlign=CenterCenter
Text=X
FontFace=Consolas
FontSize=12
FontColor=#Red#
SolidColor=0,0,0,1
AntiAlias=1
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\Launcher"]
[SearchBar]
Meter=String
X=142
Y=110
W=246
H=43
StringAlign=CenterCenter
Text=BUSCAR EN WINDOWS [WIN+S]
FontFace=Consolas
FontSize=10
FontColor=#Cyan#
SolidColor=#Card#
AntiAlias=1
LeftMouseUpAction=["powershell.exe" -NoProfile -NonInteractive -WindowStyle Hidden -File "#@#Scripts\WinPanel.ps1" -Panel Search]
[ButtonStyle]
W=112
H=47
StringAlign=CenterCenter
FontFace=Consolas
FontSize=10
FontColor=#Text#
SolidColor=#Card#
AntiAlias=1
[Terminal]
Meter=String
MeterStyle=ButtonStyle
X=78
Y=183
Text=TERMINAL
LeftMouseUpAction=["wt.exe"]
[Debian]
Meter=String
MeterStyle=ButtonStyle
X=206
Y=183
Text=DEBIAN WSL
LeftMouseUpAction=["wt.exe" -p "Debian"]
[VSCode]
Meter=String
MeterStyle=ButtonStyle
X=78
Y=239
Text=VS CODE
LeftMouseUpAction=["code.cmd"]
[Files]
Meter=String
MeterStyle=ButtonStyle
X=206
Y=239
Text=ARCHIVOS
LeftMouseUpAction=["explorer.exe"]
[Applications]
Meter=String
MeterStyle=ButtonStyle
X=78
Y=295
Text=APPS
LeftMouseUpAction=["explorer.exe" "shell:AppsFolder"]
[Control]
Meter=String
MeterStyle=ButtonStyle
X=206
Y=295
Text=CONTROL
LeftMouseUpAction=[!ActivateConfig "WORKSTATION\ControlCenter" "ControlCenter.ini"][!DeactivateConfig "WORKSTATION\Launcher"]
[Notifications]
Meter=String
MeterStyle=ButtonStyle
X=78
Y=351
Text=AVISOS
FontColor=#Red#
LeftMouseUpAction=["powershell.exe" -NoProfile -NonInteractive -WindowStyle Hidden -File "#@#Scripts\WinPanel.ps1" -Panel Notifications]
[QuickSettings]
Meter=String
MeterStyle=ButtonStyle
X=206
Y=351
Text=AJUSTES
FontColor=#Cyan#
LeftMouseUpAction=["powershell.exe" -NoProfile -NonInteractive -WindowStyle Hidden -File "#@#Scripts\WinPanel.ps1" -Panel QuickSettings]
[Footer]
Meter=String
X=22
Y=402
Text=NOCTURNE / RED TEAM / V1.1
FontFace=Consolas
FontSize=9
FontColor=#Muted#
AntiAlias=1
