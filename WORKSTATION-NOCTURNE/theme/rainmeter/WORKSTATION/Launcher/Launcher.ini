; WORKSTATION NOCTURNE v2 - Launcher interactive module
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=308
SkinHeight=586
DefaultWindowX=64
DefaultWindowY=40
DefaultAlwaysOnTop=1
DefaultDraggable=1
DefaultClickThrough=0
DefaultSnapEdges=1
OnRefreshAction=[!HideMeter "HomeIndicator" "WORKSTATION\Dock"][!HideMeter "ActivityIndicator" "WORKSTATION\Dock"][!HideMeter "OperationsIndicator" "WORKSTATION\Dock"][!HideMeter "ControlIndicator" "WORKSTATION\Dock"][!ShowMeter "LauncherIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]
OnCloseAction=[!HideMeter "LauncherIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]

[Metadata]
