DefaultSnapEdges=1
OnRefreshAction=[!ShowMeter "LauncherIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]
OnCloseAction=[!HideMeter "LauncherIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]

