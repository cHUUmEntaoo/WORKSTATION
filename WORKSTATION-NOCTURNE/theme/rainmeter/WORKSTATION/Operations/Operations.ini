[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=284
SkinHeight=640
DefaultWindowX=18
DefaultWindowY=56
DefaultAlwaysOnTop=-2
DefaultDraggable=1
DefaultSnapEdges=1
DefaultClickThrough=0

[Metadata]
Name=WORKSTATION Operations
Author=WORKSTATION ULTIMATE
Information=Low-overhead desktop telemetry. Windows CPU, RAM, network and C: disk.
Version=2.0
License=Personal use

[Variables]
Base=15,17,29,239
Card=34,37,53,235
Border=69,71,90,180
Text=205,214,244,255
Muted=166,173,200,255
Blue=137,180,250,255
Mauve=203,166,247,255
Teal=148,226,213,255
Green=166,227,161,255
Yellow=249,226,175,255

; === Live measures (local Windows data, no network APIs) ===
[Clock]
Measure=Time
Format=%H:%M

[Date]
Measure=Time
Format=%a, %d %b %Y

[CPU]
Measure=CPU
Processor=0

[RAM]
Measure=PhysicalMemory

[DiskUsed]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=30

[NetDown]
Measure=NetIn

[NetUp]
Measure=NetOut

; === Outer shell ===
[Background]
Meter=Shape
X=0
Y=0
Shape=Rectangle 1,1,282,638,16 | Fill Color #Base# | StrokeWidth 1 | Stroke Color #Border#
Shape2=Rectangle 14,14,4,25,2 | Fill Color #Blue# | StrokeWidth 0
Shape3=Line 17,135,267,135 | StrokeWidth 1 | Stroke Color 69,71,90,120
AntiAlias=1

[Title]
Meter=String
X=30
Y=16
Text=WORKSTATION
FontFace=Segoe UI Semibold
FontSize=12
FontColor=#Text#
AntiAlias=1

[SubTitle]
Meter=String
X=30
Y=38
Text=OPERATIONS  /  LIVE SYSTEM
FontFace=Consolas
FontSize=8
FontColor=#Muted#
AntiAlias=1

[ClockMeter]
Meter=String
MeasureName=Clock
X=20
Y=60
Text=%1
FontFace=Segoe UI Light
FontSize=35
FontColor=#Text#
AntiAlias=1

[DateMeter]
Meter=String
MeasureName=Date
X=23
Y=115
Text=%1
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1

; === CPU card ===
[CPUCard]
Meter=Shape
X=10
Y=146
Shape=Rectangle 0,0,264,131,12 | Fill Color #Card# | StrokeWidth 1 | Stroke Color #Border#
AntiAlias=1

[CPULabel]
Meter=String
X=24
Y=160
Text=PROCESSOR
FontFace=Consolas
FontSize=9
FontColor=#Blue#
AntiAlias=1

[CPUValue]
Meter=String
MeasureName=CPU
X=257
Y=156
StringAlign=Right
Text=%1%
FontFace=Segoe UI Semibold
FontSize=16
FontColor=#Text#
NumOfDecimals=0
AntiAlias=1

[CPULine]
Meter=Line
MeasureName=CPU
X=24
Y=194
W=233
H=64
LineCount=1
LineColor=#Blue#
LineWidth=2
HorizontalLines=1
HorizontalLineColor=69,71,90,75
AntiAlias=1

; === RAM card ===
[RAMCard]
Meter=Shape
X=10
Y=286
Shape=Rectangle 0,0,264,96,12 | Fill Color #Card# | StrokeWidth 1 | Stroke Color #Border#
AntiAlias=1

[RAMLabel]
Meter=String
X=24
Y=300
Text=MEMORY / RAM
FontFace=Consolas
FontSize=9
FontColor=#Mauve#
AntiAlias=1

[RAMValue]
Meter=String
MeasureName=RAM
Percentual=1
X=257
Y=294
StringAlign=Right
Text=%1%
FontFace=Segoe UI Semibold
FontSize=16
FontColor=#Text#
NumOfDecimals=0
AntiAlias=1

[RAMTrack]
Meter=Shape
X=24
Y=348
Shape=Rectangle 0,0,233,6,3 | Fill Color 69,71,90,220 | StrokeWidth 0

[RAMBar]
Meter=Bar
MeasureName=RAM
X=24
Y=348
W=233
H=6
BarColor=#Mauve#
BarOrientation=Horizontal

[RAMHint]
Meter=String
X=24
Y=362
Text=PHYSICAL MEMORY LOAD
FontFace=Consolas
FontSize=7
FontColor=#Muted#
AntiAlias=1

; === Network card ===
[NetworkCard]
Meter=Shape
X=10
Y=391
Shape=Rectangle 0,0,264,134,12 | Fill Color #Card# | StrokeWidth 1 | Stroke Color #Border#
AntiAlias=1

[NetworkLabel]
Meter=String
X=24
Y=405
Text=NETWORK / LIVE
FontFace=Consolas
FontSize=9
FontColor=#Teal#
AntiAlias=1

[DownValue]
Meter=String
MeasureName=NetDown
X=24
Y=427
Text=DOWN  %1B/s
AutoScale=1
NumOfDecimals=1
FontFace=Consolas
FontSize=10
FontColor=#Text#
AntiAlias=1

[UpValue]
Meter=String
MeasureName=NetUp
X=160
Y=427
Text=UP  %1B/s
AutoScale=1
NumOfDecimals=1
FontFace=Consolas
FontSize=10
FontColor=#Text#
AntiAlias=1

[NetworkGraph]
Meter=Line
MeasureName=NetDown
MeasureName2=NetUp
LineCount=2
X=24
Y=457
W=233
H=55
LineColor=#Teal#
LineColor2=#Mauve#
LineWidth=2
AutoScale=1
AntiAlias=1

; === Disk card ===
[DiskCard]
Meter=Shape
X=10
Y=534
Shape=Rectangle 0,0,264,90,12 | Fill Color #Card# | StrokeWidth 1 | Stroke Color #Border#
AntiAlias=1

[DiskLabel]
Meter=String
X=24
Y=548
Text=STORAGE  /  C:
FontFace=Consolas
FontSize=9
FontColor=#Green#
AntiAlias=1

[DiskValue]
Meter=String
MeasureName=DiskUsed
X=257
Y=543
StringAlign=Right
Percentual=1
Text=%1%
FontFace=Segoe UI Semibold
FontSize=16
FontColor=#Text#
NumOfDecimals=0
AntiAlias=1

[DiskTrack]
Meter=Shape
X=24
Y=589
Shape=Rectangle 0,0,233,6,3 | Fill Color 69,71,90,220 | StrokeWidth 0

[DiskBar]
Meter=Bar
MeasureName=DiskUsed
X=24
Y=589
W=233
H=6
BarColor=#Green#
BarOrientation=Horizontal

[DiskHint]
Meter=String
X=24
Y=603
Text=SYSTEM DISK USED
FontFace=Consolas
FontSize=7
FontColor=#Muted#
AntiAlias=1

; ================================================
; WORKSTATION - CONTROL CENTER BUTTON
; ================================================

[ControlButtonBackground]
Meter=Shape
X=215
Y=17
Shape=Rectangle 0,0,55,28,8 | Fill Color 73,24,39,230 | StrokeWidth 1 | Stroke Color 255,53,83,150
AntiAlias=1
LeftMouseUpAction=[!ToggleConfig "WORKSTATION\ControlCenter" "ControlCenter.ini"]
ToolTipText=Abrir o cerrar Control Center

[ControlButtonText]
Meter=String
X=242
Y=30
W=52
H=24
StringAlign=CenterCenter
Text=CTRL
FontFace=Consolas
FontSize=10
FontWeight=700
FontColor=255,125,145,255
SolidColor=0,0,0,1
AntiAlias=1
LeftMouseUpAction=[!ActivateConfig "WORKSTATION\ControlCenter" "ControlCenter.ini"][!DeactivateConfig "WORKSTATION\Operations"]
ToolTipText=Abrir o cerrar Control Center
