
; ================================================
; WORKSTATION NOCTURNE - CONTROL CENTER V1.1
; Windows 11 / Rainmeter
; ================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
SkinWidth=284
SkinHeight=640
DefaultWindowX=64
DefaultWindowY=40
DefaultAlwaysOnTop=1
DefaultDraggable=1
DefaultClickThrough=0
DefaultSnapEdges=1
OnRefreshAction=[!HideMeter "HomeIndicator" "WORKSTATION\Dock"][!HideMeter "LauncherIndicator" "WORKSTATION\Dock"][!HideMeter "ActivityIndicator" "WORKSTATION\Dock"][!HideMeter "OperationsIndicator" "WORKSTATION\Dock"][!ShowMeter "ControlIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]
OnCloseAction=[!HideMeter "ControlIndicator" "WORKSTATION\Dock"][!Redraw "WORKSTATION\Dock"]


[Metadata]
Name=WORKSTATION Control Center
Author=WORKSTATION ULTIMATE
Version=1.1
Information=Interactive control center with calendar navigation

; ================================================
; DESIGN TOKENS
; ================================================

[Variables]
Base=13,15,24,248
Card=29,32,45,245
Border=70,75,95,180
Text=220,225,240,255
Muted=155,163,185,255
Red=255,53,83,255
Cyan=105,218,237,255

; The Lua script updates this value automatically.
CalendarTitleText=CALENDARIO

; ================================================
; LIVE MEASURES
; ================================================

[MeasureClock]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %#d %B %Y
FormatLocale=es-ES

[MeasureCalendar]
Measure=Script
ScriptFile=#CURRENTPATH#Calendar.lua
UpdateDivider=30

[MeasureVolume]
Measure=Plugin
Plugin=Win7AudioPlugin
MaxValue=100

; ================================================
; MAIN BACKGROUND
; ================================================

[Background]
Meter=Shape
Shape=Rectangle 1,1,282,638,16 | Fill Color #Base# | StrokeWidth 1 | Stroke Color #Border#
Shape2=Rectangle 16,16,4,26,2 | Fill Color #Red# | StrokeWidth 0
AntiAlias=1

[Title]
Meter=String
X=31
Y=18
Text=CONTROL CENTER
FontFace=Segoe UI Semibold
FontSize=12
FontColor=#Text#
AntiAlias=1

[Subtitle]
Meter=String
X=31
Y=39
Text=WORKSTATION / RED TEAM
FontFace=Consolas
FontSize=8
FontColor=#Muted#
AntiAlias=1

[CloseButton]
Meter=String
X=247
Y=21
W=20
H=24
Text=X
StringAlign=Center
FontFace=Consolas
FontSize=12
FontColor=#Red#
SolidColor=0,0,0,1
AntiAlias=1
ToolTipText=Cerrar Control Center
LeftMouseUpAction=[!DeactivateConfig "WORKSTATION\ControlCenter"]

; ================================================
; CLOCK
; ================================================

[Clock]
Meter=String
MeasureName=MeasureClock
X=20
Y=65
Text=%1
FontFace=Segoe UI Light
FontSize=36
FontColor=#Text#
AntiAlias=1

[Date]
Meter=String
MeasureName=MeasureDate
X=23
Y=119
Text=%1
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1

; ================================================
; CALENDAR CARD
; ================================================

[CalendarCard]
Meter=Shape
X=10
Y=157
Shape=Rectangle 0,0,264,224,12 | Fill Color #Card# | StrokeWidth 1 | Stroke Color #Border#
AntiAlias=1

; ================================================
; DYNAMIC MONTH TITLE
; ================================================

[CalendarTitle]
Meter=String
X=24
Y=175
W=175
H=25
Text=#CalendarTitleText#
DynamicVariables=1
FontFace=Segoe UI Semibold
FontSize=12
FontColor=#Cyan#
AntiAlias=1

; ================================================
; PREVIOUS MONTH
; ================================================

[CalendarPrevious]
Meter=String
X=218
Y=174
W=24
H=25
Text=<
FontFace=Consolas
FontSize=15
FontWeight=700
FontColor=#Red#
StringAlign=Center
SolidColor=0,0,0,1
AntiAlias=1
ToolTipText=Mes anterior
LeftMouseUpAction=[!CommandMeasure "MeasureCalendar" "ChangeMonth(-1)"]

MouseOverAction=[!SetOption "CalendarPrevious" "FontColor" "#Cyan#"][!UpdateMeter "CalendarPrevious"][!Redraw]
MouseLeaveAction=[!SetOption "CalendarPrevious" "FontColor" "#Red#"][!UpdateMeter "CalendarPrevious"][!Redraw]

; ================================================
; NEXT MONTH
; ================================================

[CalendarNext]
Meter=String
X=250
Y=174
W=24
H=25
Text=>
FontFace=Consolas
FontSize=15
FontWeight=700
FontColor=#Red#
StringAlign=Center
SolidColor=0,0,0,1
AntiAlias=1
ToolTipText=Mes siguiente
LeftMouseUpAction=[!CommandMeasure "MeasureCalendar" "ChangeMonth(1)"]

MouseOverAction=[!SetOption "CalendarNext" "FontColor" "#Cyan#"][!UpdateMeter "CalendarNext"][!Redraw]
MouseLeaveAction=[!SetOption "CalendarNext" "FontColor" "#Red#"][!UpdateMeter "CalendarNext"][!Redraw]

; ================================================
; DYNAMIC CALENDAR GRID
; ================================================

[CalendarGrid]
Meter=String
MeasureName=MeasureCalendar
X=24
Y=216
W=236
H=136
Text=%1
FontFace=Consolas
FontSize=11
FontColor=#Text#
AntiAlias=1
ClipString=1

; ================================================
; RETURN TO CURRENT MONTH
; ================================================

[CalendarToday]
Meter=String
X=24
Y=356
W=120
H=20
Text=VOLVER A HOY
FontFace=Consolas
FontSize=9
FontColor=#Cyan#
SolidColor=0,0,0,1
AntiAlias=1
ToolTipText=Regresar al mes actual
LeftMouseUpAction=[!CommandMeasure "MeasureCalendar" "ResetMonth()"]

MouseOverAction=[!SetOption "CalendarToday" "FontColor" "#Red#"][!UpdateMeter "CalendarToday"][!Redraw]
MouseLeaveAction=[!SetOption "CalendarToday" "FontColor" "#Cyan#"][!UpdateMeter "CalendarToday"][!Redraw]

; ================================================
; AUDIO CONTROL
; ================================================

[AudioCard]
Meter=Shape
X=10
Y=392
Shape=Rectangle 0,0,264,110,12 | Fill Color #Card# | StrokeWidth 1 | Stroke Color #Border#
AntiAlias=1

[AudioLabel]
Meter=String
X=24
Y=405
Text=AUDIO / MASTER VOLUME
FontFace=Consolas
FontSize=9
FontColor=#Cyan#
AntiAlias=1

[VolumeValue]
Meter=String
X=256
Y=405
StringAlign=Right
Text=[MeasureVolume:]%
DynamicVariables=1
FontFace=Segoe UI Semibold
FontSize=12
FontColor=#Text#
AntiAlias=1

[VolumeTrack]
Meter=Shape
X=24
Y=435
Shape=Rectangle 0,0,234,6,3 | Fill Color 69,71,90,220 | StrokeWidth 0

[VolumeBar]
Meter=Bar
MeasureName=MeasureVolume
X=24
Y=435
W=234
H=6
BarColor=#Red#
BarOrientation=Horizontal

[VolumeMinus]
Meter=String
X=27
Y=460
W=72
H=30
Text=VOL -
FontFace=Consolas
FontSize=11
FontColor=#Text#
SolidColor=44,47,62,255
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure "MeasureVolume" "ChangeVolume -5"]
ToolTipText=Bajar volumen 5 por ciento

[VolumeMute]
Meter=String
X=107
Y=460
W=72
H=30
Text=MUTE
FontFace=Consolas
FontSize=11
FontColor=#Red#
SolidColor=44,47,62,255
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure "MeasureVolume" "ToggleMute"]
ToolTipText=Silenciar o activar audio

[VolumePlus]
Meter=String
X=187
Y=460
W=72
H=30
Text=VOL +
FontFace=Consolas
FontSize=11
FontColor=#Text#
SolidColor=44,47,62,255
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure "MeasureVolume" "ChangeVolume 5"]
ToolTipText=Subir volumen 5 por ciento

; ================================================
; QUICK ACCESS - WINDOWS SETTINGS
; ================================================

[QuickCard]
Meter=Shape
X=10
Y=513
Shape=Rectangle 0,0,264,114,12 | Fill Color #Card# | StrokeWidth 1 | Stroke Color #Border#
AntiAlias=1

[QuickLabel]
Meter=String
X=24
Y=522
Text=QUICK ACCESS
FontFace=Consolas
FontSize=9
FontColor=#Cyan#
AntiAlias=1

[QuickStyle]
W=114
H=25
FontFace=Consolas
FontSize=10
FontColor=#Text#
SolidColor=44,47,62,255
AntiAlias=1

[QuickWifi]
Meter=String
MeterStyle=QuickStyle
X=24
Y=544
Text=WI-FI
LeftMouseUpAction=[ms-settings:network-wifi]
ToolTipText=Abrir ajustes de Wi-Fi

[QuickBluetooth]
Meter=String
MeterStyle=QuickStyle
X=145
Y=544
Text=BLUETOOTH
LeftMouseUpAction=[ms-settings:bluetooth]
ToolTipText=Abrir ajustes de Bluetooth

[QuickSound]
Meter=String
MeterStyle=QuickStyle
X=24
Y=581
Text=SOUND
LeftMouseUpAction=[ms-settings:sound]
ToolTipText=Abrir ajustes de sonido

[QuickAlerts]
Meter=String
MeterStyle=QuickStyle
X=145
Y=581
Text=ALERTS
LeftMouseUpAction=[ms-settings:notifications]
ToolTipText=Abrir ajustes de notificaciones
