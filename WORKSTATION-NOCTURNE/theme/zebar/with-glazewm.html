<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e1e2e" />
    <title>WORKSTATION NOCTURNE — RED TEAM TOP BAR</title>
    <link rel="icon" href="data:;" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />

    <!-- Keep the existing, buildless React / Zebar runtime. -->
    <script
      src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"
      integrity="sha256-aS0B0wnsaDByLfE16h4MDCP1fQFccysd1YWOcV+gbBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useEffect, useState } from 'https://esm.sh/react@18?dev';
      import { createRoot } from 'https://esm.sh/react-dom@18/client?dev';
      import * as zebar from 'https://esm.sh/zebar@3.0';

      // WORKSTATION NOCTURNE v2.0 — preserve all original Zebar providers.
      const providers = zebar.createProviderGroup({
        network: { type: 'network' },
        glazewm: { type: 'glazewm' },
        cpu: { type: 'cpu' },
        date: { type: 'date', formatting: 'EEE d MMM t' },
        battery: { type: 'battery' },
        memory: { type: 'memory' },
        weather: { type: 'weather' },
      });

      const percent = (value) => {
        const n = Number(value);
        return Number.isFinite(n) ? Math.min(100, Math.max(0, Math.round(n))) : null;
      };

      function networkIcon(network) {
        const type = network?.defaultInterface?.type;
        if (type === 'ethernet') return 'nf-md-ethernet_cable';
        if (type === 'proprietary_virtual') return 'nf-md-shield_lock_outline';
        if (type !== 'wifi') return 'nf-md-wifi_strength_off_outline';

        const strength = Number(network?.defaultGateway?.signalStrength ?? 0);
        if (strength >= 80) return 'nf-md-wifi_strength_4';
        if (strength >= 65) return 'nf-md-wifi_strength_3';
        if (strength >= 40) return 'nf-md-wifi_strength_2';
        if (strength >= 25) return 'nf-md-wifi_strength_1';
        return 'nf-md-wifi_strength_outline';
      }

      function networkLabel(network) {
        const type = network?.defaultInterface?.type;
        if (type === 'ethernet') return 'ETHERNET';
        if (type === 'proprietary_virtual') return 'VPN';
        if (type === 'wifi') return network?.defaultGateway?.ssid || 'WI-FI';
        return 'OFFLINE';
      }

      function batteryIcon(charge) {
        if (charge > 90) return 'nf-fa-battery_4';
        if (charge > 70) return 'nf-fa-battery_3';
        if (charge > 40) return 'nf-fa-battery_2';
        if (charge > 20) return 'nf-fa-battery_1';
        return 'nf-fa-battery_0';
      }

      function weatherIcon(status) {
        const icons = {
          clear_day: 'nf-weather-day_sunny',
          clear_night: 'nf-weather-night_clear',
          cloudy_day: 'nf-weather-day_cloudy',
          cloudy_night: 'nf-weather-night_alt_cloudy',
          light_rain_day: 'nf-weather-day_sprinkle',
          light_rain_night: 'nf-weather-night_alt_sprinkle',
          heavy_rain_day: 'nf-weather-day_rain',
          heavy_rain_night: 'nf-weather-night_alt_rain',
          snow_day: 'nf-weather-day_snow',
          snow_night: 'nf-weather-night_alt_snow',
          thunder_day: 'nf-weather-day_lightning',
          thunder_night: 'nf-weather-night_alt_lightning',
        };
        return icons[status] || 'nf-weather-cloud';
      }

      function Metric({ kind, icon, label, usage }) {
        const value = percent(usage);
        const isHigh = value !== null && value >= 85;

        return (
          <div
            className={`chip metric metric-${kind}${isHigh ? ' alert' : ''}`}
            title={`${label}: ${value === null ? 'Sin datos' : `${value}%`}`}
          >
            <i className={`nf ${icon}`} aria-hidden="true"></i>
            <span className="metric-label">{label}</span>
            <span className="metric-value">{value === null ? '--' : `${value}%`}</span>
            <span className="meter" aria-hidden="true">
              <span style={{ width: `${value ?? 0}%` }}></span>
            </span>
          </div>
        );
      }

      function App() {
        const [output, setOutput] = useState(providers.outputMap);

        useEffect(() => {
          const unsubscribe = providers.onOutput(() => {
            setOutput({ ...providers.outputMap });
          });
          return () => {
            if (typeof unsubscribe === 'function') unsubscribe();
          };
        }, []);

        const wm = output.glazewm;
        const workspaces = wm?.currentWorkspaces ?? [];
        const focusedTitle = wm?.focusedContainer?.title || '';
        const batteryCharge = percent(output.battery?.chargePercent);
        const weatherTemp = Number(output.weather?.celsiusTemp);
        const hasWeatherTemp = Number.isFinite(weatherTemp) && output.weather?.celsiusTemp != null;
        const clock = output.date?.formatted || '--:--';

        return (
          <div className="app">
            <div className="left">
              <div className="brand" title="WORKSTATION ULTIMATE">
                <span className="brand-mark"><i className="nf nf-fa-windows" aria-hidden="true"></i></span>
                <span className="brand-stack"><span className="brand-name">WORKSTATION</span><span className="brand-subtitle">NOCTURNE</span></span>
                <span className="brand-led" aria-hidden="true"></span>
              </div>

              <div className="red-team-tag" title="Tema RED TEAM"><i className="nf nf-md-target" aria-hidden="true"></i><span>RED TEAM</span></div>
              <div className={`wm-health${wm ? ' connected' : ''}`} title={wm ? 'GlazeWM conectado' : 'GlazeWM no disponible'}><span className="wm-health-dot"></span><span>{wm ? 'SYSTEM READY' : 'WM OFFLINE'}</span></div>

              {wm && (
                <div className="workspaces" aria-label="Espacios de trabajo">
                  {workspaces.map((workspace) => (
                    <button
                      type="button"
                      key={workspace.name}
                      title={`Ir al espacio ${workspace.displayName ?? workspace.name}`}
                      aria-label={`Espacio ${workspace.displayName ?? workspace.name}`}
                      aria-current={workspace.hasFocus ? 'true' : undefined}
                      className={`workspace${workspace.isDisplayed ? ' displayed' : ''}${workspace.hasFocus ? ' focused' : ''}`}
                      onClick={() => wm.runCommand(`focus --workspace ${workspace.name}`)}
                    >
                      <span className="workspace-number">{workspace.displayName ?? workspace.name}</span>
                      <span className="workspace-indicator" aria-hidden="true"></span>
                    </button>
                  ))}
                </div>
              )}

            </div>

            <div className="center">
              <div className="window-title" title={focusedTitle || 'WORKSTATION ULTIMATE'}>
                <i className="nf nf-md-application_outline" aria-hidden="true"></i>
                <span>{focusedTitle || 'WORKSTATION // SYSTEM READY'}</span>
              </div>
            </div>

            <div className="right">
              {wm && (
                <div className="wm-controls">
                  {wm.isPaused && (
                    <button
                      type="button"
                      className="control paused-button"
                      title="Reanudar GlazeWM"
                      onClick={() => wm.runCommand('wm-toggle-pause')}
                    >
                      PAUSED
                    </button>
                  )}

                  {(wm.bindingModes ?? []).map((mode) => (
                    <button
                      type="button"
                      key={mode.name}
                      className="control binding-mode"
                      title={`Salir del modo ${mode.displayName ?? mode.name}`}
                      onClick={() => wm.runCommand(`wm-disable-binding-mode --name ${mode.name}`)}
                    >
                      {mode.displayName ?? mode.name}
                    </button>
                  ))}

                  <button
                    type="button"
                    className="control tiling-direction"
                    title="Cambiar orientación de mosaico"
                    aria-label="Cambiar orientación de mosaico"
                    onClick={() => wm.runCommand('toggle-tiling-direction')}
                  >
                    <i
                      className={`nf ${wm.tilingDirection === 'horizontal' ? 'nf-md-swap_horizontal' : 'nf-md-swap_vertical'}`}
                      aria-hidden="true"
                    ></i>
                  </button>
                </div>
              )}

              {output.network && (
                <div className="chip network" title={`Conexión: ${networkLabel(output.network)}`}>
                  <i className={`nf ${networkIcon(output.network)}`} aria-hidden="true"></i>
                  <span className="network-name">{networkLabel(output.network)}</span>
                </div>
              )}

              {output.memory && (
                <Metric kind="ram" icon="nf-fae-chip" label="RAM" usage={output.memory.usage} />
              )}

              {output.cpu && (
                <Metric kind="cpu" icon="nf-oct-cpu" label="CPU" usage={output.cpu.usage} />
              )}

              {output.battery && batteryCharge !== null && (
                <div className={`chip battery${batteryCharge <= 20 ? ' alert' : ''}`} title={`Batería: ${batteryCharge}%${output.battery.isCharging ? ' · cargando' : ''}`}>
                  {output.battery.isCharging && (
                    <i className="nf nf-md-power_plug charging-icon" aria-hidden="true"></i>
                  )}
                  <i className={`nf ${batteryIcon(batteryCharge)}`} aria-hidden="true"></i>
                  <span>{batteryCharge}%</span>
                </div>
              )}

              {output.weather && hasWeatherTemp && (
                <div className="chip weather" title="Temperatura actual">
                  <i className={`nf ${weatherIcon(output.weather.status)}`} aria-hidden="true"></i>
                  <span>{Math.round(weatherTemp)}°C</span>
                </div>
              )}
              <div className="clock" title="Fecha y hora del sistema">
                <i className="nf nf-md-clock_outline" aria-hidden="true"></i>
                <span>{clock}</span>
              </div>
            </div>
          </div>
        );
      }

      createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
